[project]
name = "electricity-planner-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "DJ"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["calculations", "power/services", "panels/services"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q"
env = [
  "DJANGO_SECRET_KEY=test-secret-key-not-for-production",
  "DJANGO_DEBUG=false",
  "DATABASE_URL=postgres://planner:planner@localhost:5432/planner",
]
