      parameters:
      - in: query
        name: brand
        schema:
          type: string
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: curve
        schema:
          type: string
          title: Характеристика
          enum:
          - B
          - C
          - D
        description: |-
          * `B` - B
          * `C` - C
          * `D` - D
      - in: query
        name: din_mountable
        schema:
          type: boolean
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this product.
        required: true
      - in: query
        name: leakage_ma
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: poles
        schema:
          type: integer
      - in: query
        name: price_max
        schema:
          type: number
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: rated_a
        schema:
          type: number
      - in: query
        name: rated_a_max
        schema:
          type: number
      - in: query
        name: rated_a_min
        schema:
          type: number
      - in: query
        name: rcd_type
        schema:
          type: string
          title: Тип УЗО
          enum:
          - A
          - AC
          - B
          - F
        description: |-
          * `AC` - AC
          * `A` - A
          * `F` - F
          * `B` - B
      - in: query
        name: tier
        schema:
          type: string
        description: eco | mid | premium
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductList'
          description: ''
  /api/v1/groups/{id}/:
    get:
      operationId: groups_retrieve
      description: |-
        Object-level access: users only ever see their own projects and children.

        Foreign objects answer 404, not 403, so ids of other users' data don't leak.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - groups
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsumerGroup'
          description: ''
    put:
      operationId: groups_update
      description: |-
        Object-level access: users only ever see their own projects and children.

        Foreign objects answer 404, not 403, so ids of other users' data don't leak.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - groups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumerGroupRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConsumerGroupRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConsumerGroupRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsumerGroup'
          description: ''
    patch:
      operationId: groups_partial_update
