            schema:
              $ref: '#/components/schemas/PatchedBulkPlacementsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBulkPlacementsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBulkPlacementsRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPlacementList'
          description: ''
