  /api/v1/panels/{panel_pk}/placements/bulk/:
    put:
      operationId: panels_placements_bulk_update
      description: |-
        Autosave: replace the panel's placements with the given full state, atomically.

        Items with ``id`` are updated, items without are created, existing placements that
        are absent from the payload are deleted. The whole result is validated first;
        on any issue nothing is changed.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: panel_pk
        schema:
          type: integer
        required: true
      tags:
      - panels
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkPlacementsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BulkPlacementsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BulkPlacementsRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPlacementList'
          description: ''
    patch:
