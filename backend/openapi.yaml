openapi: 3.0.3
info:
  title: Electricity Planner API
  version: 0.1.0
paths:
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: Sets the csrftoken cookie and returns the token for the SPA.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
        required: true
      security:
      - csrfOnly: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credentials'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
        required: true
      security:
      - csrfOnly: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credentials'
          description: ''
  /api/v1/catalog/brands/:
    get:
      operationId: catalog_brands_list
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Brand'
          description: ''
  /api/v1/catalog/brands/{id}/:
    get:
      operationId: catalog_brands_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this brand.
        required: true
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
          description: ''
  /api/v1/catalog/categories/:
    get:
      operationId: catalog_categories_list
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/catalog/categories/{id}/:
    get:
      operationId: catalog_categories_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this category.
        required: true
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/catalog/export/:
    get:
      operationId: catalog_export_retrieve
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/catalog/import/:
    post:
      operationId: catalog_import_create
      tags:
      - catalog
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ''
  /api/v1/catalog/products/:
    get:
      operationId: catalog_products_list
      parameters:
      - in: query
        name: brand
        schema:
          type: string
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: curve
        schema:
          type: string
          title: Характеристика
          enum:
          - B
          - C
          - D
        description: |-
          * `B` - B
          * `C` - C
          * `D` - D
      - in: query
        name: din_mountable
        schema:
          type: boolean
      - in: query
        name: leakage_ma
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: poles
        schema:
          type: integer
      - in: query
        name: price_max
        schema:
          type: number
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: rated_a
        schema:
          type: number
      - in: query
        name: rated_a_max
        schema:
          type: number
      - in: query
        name: rated_a_min
        schema:
          type: number
      - in: query
        name: rcd_type
        schema:
          type: string
          title: Тип УЗО
          enum:
          - A
          - AC
          - B
          - F
        description: |-
          * `AC` - AC
          * `A` - A
          * `F` - F
          * `B` - B
      - in: query
        name: tier
        schema:
          type: string
          enum:
          - eco
          - mid
          - premium
        description: |-
          * `eco` - Эконом
          * `mid` - Средний
          * `premium` - Премиум
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductList'
          description: ''
  /api/v1/catalog/products/{id}/:
    get:
      operationId: catalog_products_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this product.
        required: true
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/v1/catalog/products/{id}/analogs/:
    get:
