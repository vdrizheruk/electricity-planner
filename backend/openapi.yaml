components:
  schemas:
    AtsKindEnum:
      enum:
      - none
      - contactor
      - modular
      - manual
      type: string
      description: |-
        * `none` - Нет
        * `contactor` - На контакторах
        * `modular` - Модульный АВР
        * `manual` - Ручной I-0-II
    AutolayoutOptionsRequest:
      type: object
      properties:
        voltage_relay:
          type: boolean
          default: true
        spd:
          allOf:
          - $ref: '#/components/schemas/SpdEnum'
          default: '2'
        fire_rcd:
          type: boolean
          default: false
        reserve_pct:
          type: integer
          maximum: 100
          minimum: 0
          default: 20
        pick_enclosure:
          type: boolean
          default: true
    AutolayoutResult:
      type: object
      properties:
        placements:
          type: array
          items:
            $ref: '#/components/schemas/Placement'
        required_modules:
          type: integer
        capacity_modules:
          type: integer
        enclosure:
          type: integer
          nullable: true
        enclosure_changed:
          type: boolean
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
      required:
      - capacity_modules
      - enclosure
      - enclosure_changed
      - findings
      - placements
      - required_modules
    BackupPhaseEnum:
      enum:
      - L1
      - L2
      - L3
      type: string
      description: |-
        * `L1` - L1
        * `L2` - L2
        * `L3` - L3
    Brand:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 80
        slug:
          type: string
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        tier:
          $ref: '#/components/schemas/TierEnum'
      required:
      - id
      - name
      - slug
    BulkPlacementItemRequest:
      type: object
      properties:
        id:
          type: integer
        rail:
          type: integer
          nullable: true
        product:
          type: integer
        group:
          type: integer
          nullable: true
        start_module:
          type: integer
          minimum: 0
          nullable: true
        width_modules:
          type: integer
          minimum: 0
        x_mm:
          type: integer
          minimum: 0
          nullable: true
        y_mm:
          type: integer
          minimum: 0
          nullable: true
        w_mm:
          type: integer
          minimum: 1
          nullable: true
        h_mm:
          type: integer
          minimum: 1
          nullable: true
        label:
          type: string
          maxLength: 64
      required:
      - product
    BulkPlacementsRequest:
      type: object
      description: 'Autosave payload: full desired state of the panel''s placements.'
      properties:
        placements:
          type: array
          items:
            $ref: '#/components/schemas/BulkPlacementItemRequest'
      required:
      - placements
    Calculation:
      type: object
      properties:
        ok:
          type: boolean
        groups:
          type: array
          items:
            $ref: '#/components/schemas/GroupResult'
        rcds:
          type: array
          items:
            $ref: '#/components/schemas/Rcd'
        demand:
          $ref: '#/components/schemas/Demand'
        phases:
          $ref: '#/components/schemas/Phases'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
      required:
      - demand
      - findings
      - groups
      - ok
      - phases
      - rcds
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          $ref: '#/components/schemas/CodeEnum'
        name_ru:
          type: string
          maxLength: 120
        name_uk:
          type: string
          maxLength: 120
      required:
