  /api/v1/panels/{id}/autolayout/:
    post:
      operationId: panels_autolayout_create
      description: |-
        Auto-layout: input devices, relay/SPD, RCDs with their breakers; picks an enclosure.

        Replaces all DIN-rail placements of the panel (mounting-panel items are kept).
        Unassigned groups of a main panel are assigned to it.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - panels
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutolayoutOptionsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AutolayoutOptionsRequest'
          multipart/form-data:
