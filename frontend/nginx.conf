server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build artefacts never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated; client-side routes fall back to it.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
