{{- if include "ep.managesSecret" . }}
{{- $name := include "ep.secretName" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ep.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if include "ep.managedAppKey" . }}
  {{ .Values.secret.secretKeyKey }}: {{ .Values.secret.djangoSecretKey | default ((get $old .Values.secret.secretKeyKey) | b64dec) | default (randAlphaNum 64) | quote }}
  {{- end }}
  {{- if include "ep.managedPgKey" . }}
  {{ .Values.postgresql.auth.passwordKey }}: {{ .Values.postgresql.auth.password | default ((get $old .Values.postgresql.auth.passwordKey) | b64dec) | default (randAlphaNum 32) | quote }}
  {{- end }}
  {{- if include "ep.managedDbKey" . }}
  {{ .Values.database.urlKey }}: {{ .Values.database.url | quote }}
  {{- end }}
{{- end }}
