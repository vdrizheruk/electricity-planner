# Edge proxy: /api, /admin, /static and the probes go to Django, everything else to the SPA.
upstream backend {
    server backend:8000;
}
upstream frontend {
    server frontend:8080;
}

# Keep the scheme set by a TLS-terminating load balancer in front of this nginx.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}

server {
    listen 80;
    server_name _;

    # PDF export posts the drawings of all boards as JSON.
    client_max_body_size 32m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 120s;

    location ~ ^/(api|admin|static)/ {
        proxy_pass http://backend;
    }
    location = /healthz {
        proxy_pass http://backend;
    }
    location = /readyz {
        proxy_pass http://backend;
    }
    location / {
        proxy_pass http://frontend;
    }
}
