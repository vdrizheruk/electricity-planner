name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # WeasyPrint needs pango and the HarfBuzz subsetter; the PDF tests render real documents.
  SYSTEM_PACKAGES: libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core

jobs:
  backend:
    name: Backend (ruff, mypy, migrations, OpenAPI, pytest)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: planner
          POSTGRES_DB: planner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U planner" --health-interval 5s
          --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-secret-key-not-for-production
      DJANGO_DEBUG: "false"
      DATABASE_URL: postgres://planner:planner@localhost:5432/planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $SYSTEM_PACKAGES
        working-directory: .
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: No model changes without a migration
        run: python manage.py makemigrations --check --dry-run
      - name: OpenAPI schema is valid and committed
        run: |
          python manage.py spectacular --file /tmp/openapi.yaml --validate --fail-on-warn
          diff -u openapi.yaml /tmp/openapi.yaml
      - run: pytest

  frontend:
    name: Frontend (eslint, prettier, tsc, vitest, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: API types match the OpenAPI schema
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: planner
          POSTGRES_DB: planner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U planner" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      DJANGO_SECRET_KEY: ci-secret-key-not-for-production
      DJANGO_DEBUG: "true"
      DATABASE_URL: postgres://planner:planner@localhost:5432/planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $SYSTEM_PACKAGES
      - run: pip install -r backend/requirements.txt
      - name: Prepare the database
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py seed_catalog
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run the tests (Playwright starts Django and Vite itself)
        run: npx playwright test --trace off
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results
          retention-days: 7

  helm:
    name: Helm chart (lint, template, kubeconform)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
      - run: deploy/helm-check.sh

  docker:
    name: Docker images and compose smoke test
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: electricity-planner-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build frontend image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          load: true
          tags: electricity-planner-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Start the stack
        env:
          DJANGO_SECRET_KEY: ci-compose-secret-key-not-for-production
          POSTGRES_PASSWORD: ci-compose-password
        run: docker compose up --build --wait --wait-timeout 240
      - name: Smoke test through nginx
        run: deploy/smoke.sh http://localhost:8080
      - name: Logs on failure
        if: failure()
        env:
          DJANGO_SECRET_KEY: x
          POSTGRES_PASSWORD: x
        run: docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        env:
          DJANGO_SECRET_KEY: x
          POSTGRES_PASSWORD: x
        run: docker compose down -v
